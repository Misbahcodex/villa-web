  <rect x="180" y="140" width="440" height="320" rx="4" fill="#FFFFFF" stroke="#D8D4D6" stroke-width="2"/>
  <rect x="220" y="180" width="100" height="100" rx="4" fill="#F6F4F5" stroke="#6B7C98" stroke-width="1.5"/>
  <rect x="350" y="180" width="100" height="100" rx="4" fill="#F6F4F5" stroke="#6B7C98" stroke-width="1.5"/>
  <rect x="480" y="180" width="100" height="100" rx="4" fill="#F6F4F5" stroke="#6B7C98" stroke-width="1.5"/>
