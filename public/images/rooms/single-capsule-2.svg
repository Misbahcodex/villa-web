  <rect x="220" y="320" width="360" height="80" rx="2" fill="#F6F4F5" stroke="#D8D4D6"/>
  <line x1="240" y1="360" x2="560" y2="360" stroke="#7B7F8A" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="400" y="520" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#1C1816" text-anchor="middle">Single Capsule Pod</text>
