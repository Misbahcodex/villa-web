<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pod3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F4F5"/>
      <stop offset="100%" stop-color="#E9E6E7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pod3)"/>
  <!-- Pod Bay Corridor Perspective -->
  <polygon points="100,50 300,180 300,550 100,550" fill="#FFFFFF" stroke="#D8D4D6" stroke-width="1.5"/>
  <polygon points="700,50 500,180 500,550 700,550" fill="#FFFFFF" stroke="#D8D4D6" stroke-width="1.5"/>
  <!-- Central walkway -->
  <polygon points="300,180 500,180 650,600 150,600" fill="#F6F4F5" stroke="#D8D4D6" stroke-width="1.5"/>
  <!-- Soft corridor floor wash lights -->
  <line x1="300" y1="550" x2="500" y2="550" stroke="#6B7C98" stroke-width="2" opacity="0.6"/>
  <text x="400" y="340" font-family="'Cormorant Garamond', serif" font-size="24" font-weight="600" fill="#1C1816" text-anchor="middle">Single Capsule Pod</text>
</svg>
