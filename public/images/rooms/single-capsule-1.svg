<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pod1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9E6E7"/>
      <stop offset="100%" stop-color="#E9E6E7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#pod1)"/>
  <!-- Pod Structure -->
  <rect x="80" y="80" width="640" height="440" rx="6" fill="#E9E6E7" stroke="#6B7C98" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Mattress Bedding -->
  <rect x="120" y="320" width="560" height="160" rx="4" fill="#AB978C" opacity="0.9"/>
  <!-- Headrest Pillow -->
  <rect x="140" y="270" width="140" height="70" rx="8" fill="#E9E6E7"/>
  <!-- Warm Ambient Recessed Light Strip -->
  <line x1="120" y1="120" x2="680" y2="120" stroke="#6B7C98" stroke-width="4" opacity="0.9"/>
  <circle cx="200" cy="180" r="100" fill="#6B7C98" opacity="0.08"/>
  <!-- Ergonomic Reading Lamp & Tech Shelf -->
  <rect x="520" y="220" width="160" height="18" rx="2" fill="#5E5653"/>
  <circle cx="560" cy="200" r="8" fill="#6B7C98"/>
  <!-- Typography Badge -->
  <rect x="250" y="20" width="300" height="36" rx="2" fill="#E9E6E7" stroke="#5E5653"/>
  <text x="400" y="44" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#6B7C98" letter-spacing="2" text-anchor="middle">SINGLE CAPSULE POD</text>
</svg>
