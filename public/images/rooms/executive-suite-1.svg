<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ex1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F4F5"/>
      <stop offset="100%" stop-color="#E9E6E7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#ex1)"/>
  <!-- Suite Master Room Architecture -->
  <polygon points="50,100 250,50 550,50 750,100 750,520 50,520" fill="#FFFFFF" stroke="#D8D4D6" stroke-width="1.5"/>
  <!-- Marble Accent Wall -->
  <rect x="250" y="50" width="300" height="250" fill="#F6F4F5" stroke="#6B7C98" stroke-width="1" stroke-opacity="0.5"/>
  <!-- King Bed -->
  <rect x="200" y="280" width="400" height="220" rx="4" fill="#AB978C"/>
  <rect x="230" y="240" width="150" height="70" rx="4" fill="#FFFFFF" stroke="#D8D4D6"/>
  <rect x="420" y="240" width="150" height="70" rx="4" fill="#FFFFFF" stroke="#D8D4D6"/>
  <!-- Private Terrace Door -->
  <rect x="80" y="160" width="100" height="300" fill="#6B7C98" fill-opacity="0.2" stroke="#6B7C98" stroke-width="1"/>
  <!-- Luxury Badge -->
  <rect x="250" y="20" width="300" height="34" rx="2" fill="#FFFFFF" stroke="#6B7C98" stroke-width="1.5"/>
  <text x="400" y="42" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1C1816" letter-spacing="2" text-anchor="middle">EXECUTIVE PRIVATE SUITE</text>
</svg>
