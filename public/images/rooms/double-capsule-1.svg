      <stop offset="0%" stop-color="#F6F4F5"/>
      <stop offset="100%" stop-color="#E9E6E7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#db1)"/>
  <!-- Double-Width Pod Frame -->
