  <circle cx="570" cy="170" r="30" fill="#6B7C98" opacity="0.15"/>
  <circle cx="230" cy="170" r="8" fill="#6B7C98"/>
  <circle cx="570" cy="170" r="8" fill="#6B7C98"/>
  <!-- Highlight Badge -->
  <rect x="260" y="25" width="280" height="34" rx="2" fill="#FFFFFF" stroke="#6B7C98" stroke-width="1.5"/>
  <text x="400" y="47" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#1C1816" letter-spacing="2" text-anchor="middle">DOUBLE CAPSULE POD</text>
