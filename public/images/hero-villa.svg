<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F4F5"/>
      <stop offset="50%" stop-color="#E9E6E7"/>
      <stop offset="100%" stop-color="#E9E6E7"/>
    </linearGradient>
    <linearGradient id="champagneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B7C98" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#AB978C" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B7C98" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4F5E78" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Architectural Villa Outline & Windows (Light Luxury) -->
  <path d="M200 750 L200 350 L850 240 L1720 350 L1720 750 Z" fill="#FFFFFF" stroke="#7B7F8A" stroke-width="2"/>
  <rect x="300" y="380" width="220" height="340" fill="#F6F4F5" stroke="#6B7C98" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="560" y="380" width="300" height="340" fill="#F6F4F5" stroke="#7B7F8A" stroke-width="1.5"/>
  <rect x="900" y="340" width="380" height="380" fill="#FFFFFF" stroke="#6B7C98" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="1320" y="380" width="300" height="340" fill="#F6F4F5" stroke="#7B7F8A" stroke-width="1.5"/>
  
  <!-- Warm Soft Glows -->
  <circle cx="410" cy="500" r="140" fill="#AB978C" opacity="0.12"/>
  <circle cx="1090" cy="500" r="180" fill="#6B7C98" opacity="0.12"/>
  <circle cx="1470" cy="500" r="130" fill="#AB978C" opacity="0.12"/>

  <!-- Outdoor Pool Reflection -->
  <polygon points="120,780 1800,780 1920,1080 0,1080" fill="url(#poolGrad)"/>
  <line x1="120" y1="780" x2="1800" y2="780" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7"/>
  <path d="M250 860 Q 960 840 1670 860" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M180 940 Q 960 920 1740 940" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
  
  <!-- Subtle Architectural Grid Lines -->
  <line x1="960" y1="0" x2="960" y2="750" stroke="#7B7F8A" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
  <line x1="0" y1="350" x2="1920" y2="350" stroke="#7B7F8A" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Centered Typographic Overlay -->
  <text x="960" y="180" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" fill="#5E5653" letter-spacing="8" text-anchor="middle">RIZQ LUXURIOUS VILLA • DUBAI</text>
</svg>
